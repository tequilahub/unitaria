name: Quarto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          environment-file: unitaria-tutorials/environment.yml
          auto-update-conda: true
          activate-environment: UnitariaTutorials

      - name: Install ipykernel
        run: |
          conda run -n UnitariaTutorials conda install -y ipykernel
          conda run -n UnitariaTutorials python -m ipykernel install --user --name UnitariaTutorials

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Build Sphinx documentation
        run: |
          uv sync --group docs
          # Build current git version
          LATEST_GIT_COMMIT=git-$(git rev-parse --short HEAD)
          LATEST_GIT_COMMIT=$LATEST_GIT_COMMIT DOCS_VERSION=git uv run sphinx-build -b html docs docs/_build/html/git
          
          # Build tagged versions
          CURRENT_COMMIT=$(git rev-parse HEAD)
          for tag in $(git tag --sort=-v:refname); do
            if [ "$tag" != "v0.0.0" ]; then
              rm -f uv.lock
              git checkout --quiet tags/$tag
              git checkout $CURRENT_COMMIT -- docs/conf.py docs/_templates/
              uv sync --group docs
              LATEST_GIT_COMMIT=$LATEST_GIT_COMMIT DOCS_VERSION=$tag uv run sphinx-build -b html docs docs/_build/html/$tag
            fi
          done
          rm -f uv.lock
          git checkout --quiet $CURRENT_COMMIT

      - name: Build Quarto site
        run: |
          quarto render --output-dir ../_site
        working-directory: unitaria-tutorials

      - name: Copy docs into Quarto site
        run: |
          mkdir -p _site/docs
          cp -r docs/_build/html/* _site/docs/
          echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=git/index.html"><script>window.location.replace("git/index.html")</script><title>Redirecting...</title><a href="git/index.html">Click here if you are not redirected.</a>' > _site/docs/index.html
          
      - name: List workspace and _site contents
        run: |
          echo "Workspace root:" && ls -l
          echo "_site directory:" && ls -l _site || echo "_site does not exist"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5