<div class="furo-version-switcher"
     style="padding: 1rem; border-top: 1px solid var(--color-sidebar-item-background--hover);">
    <div style="margin-bottom: 1rem;">
        <a href="https://github.com/tequilahub/unitaria" target="_blank" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--color-foreground-primary); font-weight: bold;">
            <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="16" width="16">
                <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            GitHub Repository
        </a>
    </div>
    <label for="version-select"
           style="display: block; margin-bottom: 0.5rem; font-weight: bold; color: var(--color-foreground-primary);">
        Version: {% if current_version == "git" %}git ({{ latest_git_commit }}){% else %}{{ current_version }}{% endif %}
    </label>
    <select id="version-select"
            style="width: 100%; padding: 0.25rem; border-radius: 4px; border: 1px solid var(--color-sidebar-item-background--hover); background-color: var(--color-background-primary); color: var(--color-foreground-primary);">
        {% for version in versions %}
        <option value="{{ version }}" {% if version == current_version %}selected{% endif %}>
            {% if version == "git" %}git ({{ latest_git_commit }}){% else %}{{ version }}{% endif %}
        </option>
        {% endfor %}
    </select>
</div>

<script>
    document.getElementById("version-select").addEventListener("change", function () {
        const currentVersion = "{{ current_version }}";
        const currentPath = currentVersion.startsWith("git") ? "git" : currentVersion;
        const targetVersion = this.value;
        const targetPath = targetVersion.startsWith("git") ? "git" : targetVersion;
        window.location.href = window.location.href.replace("/" + currentPath + "/", "/" + targetPath + "/");
    });
</script>
